Basic.SelectedSourcePopup.Guide.Dshow_Input="เพิ่มแหล่งข้อมูลนี้เพื่อใช้เว็บแคม, DSLR, และแคปเจอร์บอร์ด\nหากคุณเลือกอุปกรณ์ในการตั้งค่าแหล่งข้อมูล หน้าจอของอุปกรณ์จะถูกเพิ่มค่ะ"
Basic.SelectedSourcePopup.Guide.Wsaapi_Input_Capture="ต้องการส่งเฉพาะเสียงของไมค์ที่ใช้อยู่เท่านั้นหรือคะ\nการเพิ่มแหล่งข้อมูลและการเลือกอุปกรณ์จะสร้างแหล่งข้อมูลเสียงเฉพาะค่ะ"
Basic.SelectedSourcePopup.Guide.Wsaapi_Output_Capture="คุณต้องการส่งเฉพาะเสียงลำโพงที่เฉพาะเจาะจงหรือไม่?\nการเพิ่มแหล่งข้อมูลและการเลือกอุปกรณ์จะสร้างแหล่งข้อมูลเสียงเฉพาะค่ะ"
Basic.SelectedSourcePopup.Guide.Wsaapi_Process_Output_Capture="หากต้องการส่งเฉพาะเสียงและเพลงที่กำลังดำเนินการอยู่ กรุณาเพิ่มด้วยค่ะ!\nหากเลือกโปรแกรมในการตั้งค่าแหล่งข้อมูล จะมีการเพิ่มเสียงเฉพาะค่ะ!"
Basic.SelectedSourcePopup.Guide.Browser_Source="แหล่งที่มาของโปรแกรมของบุคคลที่สาม เช่น แชท, การแจ้งเตือน เป็นต้น บนหน้าจอการออกอากาศ\nคุณสามารถใช้มันได้โดยการเพิ่มแหล่งข้อมูลและใส่ที่อยู่ URL"
Basic.SelectedSourcePopup.Guide.Image_Source="Mimgif คุณต้องการส่งภาพเหมือนแบนเนอร์หรือไม่?\nลองเพิ่มภาพที่บันทึกไว้ในพีซีดูค่ะ!"
Basic.SelectedSourcePopup.Guide.SlideShow="คุณต้องการแสดงภาพหลายภาพตามลำดับในเวลาที่กำหนดหรือไม่?\nกรุณาเพิ่มภาพเพื่อสร้างสไลด์โชว์ค่ะ!"
Basic.SelectedSourcePopup.Guide.FFmpeg_Source="อยากให้ดูวีดีโอตอนไลฟ์ไหมครับ?\nหลังจากเพิ่มซอสแล้ว ลองเรียกวิดีโอที่บันทึกไว้ในพีซีมาดูค่ะ!"
Basic.SelectedSourcePopup.Guide.Text_Gdiplus="สามารถโชว์ซับไตเติ้ลให้หน้าจอรายการดูได้ครับ\nเพิ่มซอสและกรอกข้อความที่ต้องการค่ะ"
Basic.SelectedSourcePopup.Guide.Color_Source="ต้องการพื้นหลังเต็มจอมั้ยครับ?\nการเพิ่มซอสและเลือกสีที่ต้องการจะทำให้พื้นหลังของการออกอากาศสมบูรณ์ค่ะ"
Basic.SelectedSourcePopup.Guide.PainterSource="เพื่อให้คำอธิบายเข้าใจง่ายขึ้นและการปฏิสัมพันธ์น่าสนใจยิ่งขึ้น\nสามารถวาดลงบนหน้าจอถ่ายทอดสดได้"
Basic.SelectedSourcePopup.Guide.Scene="อยากแสดงฉากอื่นให้ดูตอนนี้มั้ยครับ?\nเพิ่มซอสและเลือกฉากค่ะ!"
Basic.SelectedSourcePopup.Guide.Group="อยากเอาซอสมาจัดการรวมกันหรอครับ?\nเพิ่มซอสกลุ่มและลากซอสเพื่อสร้างกลุ่ม"

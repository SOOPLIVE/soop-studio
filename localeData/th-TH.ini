breaktime.title.tooltip="• หน้าจอที่เลือกจะถูกแสดงและเพลงพื้นหลังเริ่มต้นจะถูกเล่น\n• โฆษณาช่วงพักจะถูกแสดงให้กับผู้เข้าชมแต่ละคนเป็นรายบุคคลและเวลาเริ่มต้นอาจแตกต่างกันไป\n• ผู้เข้าชมบางคนอาจยังคงดูโฆษณาต่อไปหลังจากช่วงพักสิ้นสุดแล้ว\n• หลังจากโฆษณาสิ้นสุดจะมีการแสดงสรุปจำนวนการเล่นโฆษณาแบบสั้นๆ\n• คุณสามารถดูจำนวนครั้งที่โฆษณาถูกเล่นได้อย่างแม่นยำในเมน“โฆษณาของฉัน”"

Caution.SOOPManner.ContentWarning1="- การสตรีมเนื้อหาที่อาจเป็นการละเมิดลิขสิทธิ์ <font color='#D5D7DC'>เว้นแต่จะเป็นการสตรีมที่มีวัสดุที่ได้รับอนุญาตจากเจ้าของลิขสิทธิ์</font> (เช่น วิดีโอ, เพลง, รูปภาพ, ฟอนต์, ฯลฯ ที่ไม่ได้รับการคุ้มครองลิขสิทธิ์)"
Caution.SOOPManner.ContentWarning2="- การสตรีม <font color='#D5D7DC'>เนื้อหาหยาบคายหรืออนาจาร</font> ที่ละเมิดระเบียบสาธารณะและบรรทัดฐานทางสังคม"
Caution.SOOPManner.ContentWarning3="- การสตรีมที่ <font color='#D5D7DC'>ละเมิดความเป็นส่วนตัวของบุคคล, ใส่ร้ายผู้อื่น, หรือละเมิดสิทธิภาพภาพ</font> หรือ <font color='#D5D7DC'>ถ่ายทอดสดผู้อื่นโดยไม่ได้รับอนุญาตและเปิดเผยข้อมูลส่วนบุคคล</font>"
Caution.SOOPManner.ContentWarning4="- การสตรีมที่ละเมิดกฎหมายเช่น <font color='#D5D7DC'>พระราชบัญญัติการจราจรทางบก หรือความผิดเล็กน้อย</font> ซึ่งอาจเสี่ยงต่อความปลอดภัย"
Caution.SOOPManner.ContentWarning5="- การสตรีมที่ <font color='#D5D7DC'>ส่งเสริมการเลือกปฏิบัติต่อผู้พิการ</font> หรือกลุ่มคนที่ด้อยโอกาสทางสังคม, หรือ <font color='#D5D7DC'>ละเมิดสิทธิของพวกเขา</font>"
Caution.SOOPManner.ContentWarning6="- การใช้คำพูดหยาบคายรวมถึงการสบถ หรือการใช้คำพูดที่ดูถูกบุคคลด้วยคำพูดหยาบคาย <font color='#D5D7DC'>หรือทำให้เกิดความรู้สึกไม่สบายใจ</font> หรือความเกลียดชังในสตรีม"
Caution.SOOPManner.ContentWarning7="- การทำกิจกรรม <font color='#D5D7DC'>ทางธุรกิจหรือการทำกำไร</font> โดยไม่ได้รับความยินยอมจากบริษัท"
Caution.SOOPManner.ContentWarning8="- การทำโฆษณาปลอม หรือการโฆษณาที่เกินจริงซึ่งทำให้ผู้ใช้ได้รับความเสียหาย"
Caution.SOOPManner.ContentWarning9="- การสตรีม <font color='#D5D7DC'>การพนัน, การดื่ม, การสูบบุหรี่, ฉากโหดร้าย, เสนอแนะ, หรือฉากความรุนแรง (รวมถึงเกม)</font> โดยไม่ได้ตั้งข้อจำกัดอายุ 19+"
Caution.SOOPManner.ContentWarning10="- การเข้าพื้นที่อาศัย หรืออาคารที่มีการจัดการโดยไม่ได้รับอนุญาต หรือเข้าถึง <font color='#D5D7DC'>อาคารที่ถูกทิ้งร้าง หรือเสื่อมสภาพโดยไม่มีเหตุผลที่ถูกต้อง</font> (เหตุผลที่ถูกต้องรวมถึงการได้รับอนุญาตจากเจ้าของ, การป้องกันอันตรายที่อาจเกิดขึ้น, หรือการทำเพื่อประโยชน์สาธารณะ)"
Caution.SOOPManner.ContentWarning11="- ผู้สตรีมที่ทำกิจกรรมเพื่อการทำกำไรผ่านการแนะนำสตรีม (เช่น การแนะนำการลงทุน หรือคำแนะนำเกี่ยวกับหุ้น) โดยไม่ได้ลงทะเบียนเป็นธุรกิจที่ให้คำปรึกษาการลงทุนประเภทนั้น"
Caution.SOOPManner.MonitoringPolicy="- หากพบเนื้อหาดังกล่าวผ่านการตรวจสอบ การสตรีมอาจถูกยุติโดยไม่มีการเตือนล่วงหน้า และอาจมีการจำกัดหรือระงับบริการ"
Caution.SOOPManner.PolicyReference="- สำหรับนโยบายการดำเนินงานที่ละเอียด\nโปรดดูที่ส่วนของนโยบายการดำเนินงานบนเว็บไซต์ SOOP\nหรือหน้าการฝึกอบรมสตรีมเมอร์"
